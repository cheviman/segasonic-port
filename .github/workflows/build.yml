# Name:        build.yml
# Description: builds the game on clean machines with no ROM set (Linux with GCC, macOS with Clang,
#              Windows with MSVC), SDL 3 inside the executables, and packs what a player runs: the
#              executables only, which load the player's assets pack, with their licenses; the Nintendo
#              Switch's .nsp pieces with devkitPro's toolchain and Android's game without a pack with the
#              NDK, both in every package beside the tools that make the player's .nsp and APK of them;
#              Anbernic's handhelds' folder for Roms/PORTS with Zig, a package of its own; a tag v* makes a
#              release of those packages
# Version:     0.7.0
# Created:     20-10-2026
# Modified:    27-11-2026
# Author:      Sebastian Toyos
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-universal
            os: macos-15    # (GitHub retires macos-14 on 2 November 2026; the .app is still for macOS 11 on)
          - name: windows-x64
            os: windows-2022
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [switch, android]    # (their games go in the package, beside SegaSonic NSP and SegaSonic APK)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, MULTIPLAYER's)

      # SDL 3 is built from its source (SEGASONIC_STATIC_SDL): on Linux it needs the headers of what it
      # talks to (it loads the libraries themselves when the game runs). SDL 3 stops at its configure where a
      # header of what it builds in by default is missing (SDL 2 left that part out): the list is complete
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpipewire-0.3-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL=ON

      - name: Configure (macOS, Apple silicon and Intel)
        if: runner.os == 'macOS'
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/cmake -DSEGASONIC_REFERENCE_TOOLS=OFF -DSEGASONIC_STATIC_SDL=ON

      - name: Build
        run: cmake --build build/cmake --config Release --parallel

      # the Switch's and Android's games, which SegaSonic NSP and SegaSonic APK make the player's .nsp and
      # APK of: the folders switch and android beside them
      - uses: actions/download-artifact@v8
        with:
          name: segasonic-switch
          path: build/bin/switch

      - uses: actions/download-artifact@v8
        with:
          name: segasonic-android
          path: build/bin/android

      # what a player runs (no headless runs, no build leftovers), in an archive of our own: the artifacts'
      # zip loses the executables' permissions. With it, the terms the executables come with: the project's,
      # MAME's and ymfm's (BSD-3: the board's libraries follow their behavior and tables), SDL 3's (zlib) and
      # Kenney's (CC0). The .apps are signed ad hoc (no certificate): macOS then offers to open them anyway,
      # where a bundle signed in part is "damaged"
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist/segasonic/licenses
          for file in build/bin/*; do
            case "$(basename "$file")" in
              *headless*|*.pdb|*.ilk|*.exp|*.lib|*.a) ;;
              *) cp -R "$file" dist/segasonic/ ;;
            esac
          done
          cp LICENSE dist/segasonic/LICENSE.txt
          cp recomplauncher.json dist/segasonic/    # (RecompLauncher's setup, settings and start, beside the games)
          cp tools/reference/mame/LICENSE dist/segasonic/licenses/MAME.txt
          cp tools/reference/ymfm/LICENSE dist/segasonic/licenses/ymfm.txt
          cp build/cmake/_deps/sdl3-src/LICENSE.txt dist/segasonic/licenses/SDL3.txt
          cp ports/sdl/font/License.txt dist/segasonic/licenses/Kenney-Fonts.txt
          cp lan/LICENSE dist/segasonic/licenses/arcade-lan.txt
          cp ports/sdl/controllerdb/LICENSE dist/segasonic/licenses/SDL_GameControllerDB.txt
          if [ -f ports/sdl/prompts/License.txt ]; then
            cp ports/sdl/prompts/License.txt dist/segasonic/licenses/Kenney-Input-Prompts.txt
          fi
          if [ -f docs/package/README.txt ]; then
            cp docs/package/README.txt dist/segasonic/README.txt    # (what the package holds, for its player)
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            for app in dist/segasonic/*.app; do
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            done
          fi
          ls -la dist/segasonic dist/segasonic/licenses
          cd dist
          case "$RUNNER_OS" in
            Linux) tar czf segasonic-${{ matrix.name }}.tar.gz segasonic ;;
            macOS) ditto -c -k --keepParent segasonic segasonic-${{ matrix.name }}.zip ;;
            Windows) 7z a -tzip segasonic-${{ matrix.name }}.zip segasonic ;;
          esac
          cd ..
          tar czf dist/segasonic-${{ matrix.name }}-all.tar.gz -C build bin

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-${{ matrix.name }}
          path: |
            dist/segasonic-${{ matrix.name }}.*
            dist/segasonic-${{ matrix.name }}-all.tar.gz

  # The Nintendo Switch: SegaSonic.nro (the Homebrew Menu) and the .nsp's pieces (main, main.npdm,
  # control.nacp, icon.jpg, font.bmp), with devkitPro's toolchain in its own image
  switch:
    name: switch
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, MULTIPLAYER's)

      - name: Configure
        run: /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -S . -B build/switch -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF

      - name: Build
        run: cmake --build build/switch --target SegaSonic_switch --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-switch
          path: build/bin/switch/

  # Android: the game without an assets pack or a signature (build/bin/android/segasonic-base.apk), with
  # the NDK and the SDK's tools of the runner's Android SDK and its Java 17 (ports/android/android.cmake)
  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, MULTIPLAYER's)

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: Configure
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake -S . -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24

      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake --build build/android --target segasonic_apk --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-android
          path: build/bin/android/segasonic-base.apk    # (the game alone: not the runner's own APK beside it)

  # Anbernic's H700 handhelds: the folder for the stock firmware's Roms/PORTS, built with Zig for its glibc
  # and against its SDL 2.0.12 (SDL 2's headers from its source; the window port's SDL 3 names over them,
  # ports/sdl/sdl2_layer.h; check_sdl.py fails the build on any function newer than the firmware's;
  # ports/anbernic/anbernic.cmake), without an assets pack, which the player puts in it
  # (docs/package/anbernic/README.txt)
  anbernic:
    name: anbernic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, MULTIPLAYER's)

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
          mkdir -p build/downloads/zig build/downloads/sdl2-source
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz | tar xJ -C build/downloads/zig
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz \
            | tar xz -C build/downloads/sdl2-source

      - name: Configure
        run: |
          cmake -S . -B build/anbernic -G Ninja -DCMAKE_BUILD_TYPE=Release -DSEGASONIC_REFERENCE_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=ports/anbernic/zig_aarch64.cmake -DSEGASONIC_ANBERNIC=ON \
            -DSEGASONIC_SDL2_INCLUDE="$PWD/build/downloads/sdl2-source/SDL2-2.32.10/include"

      - name: Build
        run: cmake --build build/anbernic --target SegaSonic --parallel

      # the folder PORTS with the project's, MAME's, ymfm's and Kenney's terms in the game's folder (no SDL2:
      # the game takes the firmware's), and the README that says how to add the assets pack
      - name: Pack
        run: |
          package=dist/segasonic-anbernic
          mkdir -p $package/PORTS/segasonic/licenses
          cp -R build/anbernic/PORTS/. $package/PORTS/
          cp LICENSE $package/PORTS/segasonic/LICENSE.txt
          cp tools/reference/mame/LICENSE $package/PORTS/segasonic/licenses/MAME.txt
          cp tools/reference/ymfm/LICENSE $package/PORTS/segasonic/licenses/ymfm.txt
          cp lan/LICENSE $package/PORTS/segasonic/licenses/arcade-lan.txt
          if [ -f ports/sdl/prompts/License.txt ]; then
            cp ports/sdl/prompts/License.txt $package/PORTS/segasonic/licenses/Kenney-Input-Prompts.txt
          fi
          cp docs/package/anbernic/README.txt $package/README.txt
          chmod +x $package/PORTS/SegaSonic.sh $package/PORTS/segasonic/SegaSonic
          ls -laR $package
          cd dist && zip -r -X segasonic-anbernic.zip segasonic-anbernic

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-anbernic
          path: dist/segasonic-anbernic.zip

  # A tag v*: the packages as a GitHub release, its notes from docs/releases/TAG.md
  # The Raspberry Pi 3 and later (64-bit Raspberry Pi OS): both games for Linux on arm64, built in Debian 12's
  # own image on an arm64 runner and packed with their pictures, README and licenses (ports/raspberrypi/build.sh)
  raspberrypi:
    name: raspberrypi-arm64
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      # (git before the checkout: without it the action takes the repository's archive, which has no submodules)
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build and pack
        run: sh ports/raspberrypi/build.sh --tools

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-raspberrypi-arm64
          path: dist/segasonic-raspberrypi-arm64.tar.gz

  # iOS: SegaSonic's app for an iPhone or an iPad (arm64), with Xcode through CMake's Xcode generator and
  # SDL 3 from its source (ports/ios/ios.cmake; the icon the repository's), not signed (no key nor team:
  # the player's sideloading tool signs them), an .ipa with no assets (build/bin-ios/ios), which takes the
  # assets out of the player's sonic.zip in its Documents folder at its first start. The check reads them
  # back: the Info.plist's keys, the executable arm64 for iOS, the bundle's resources, the .ipa's entries
  ios:
    name: ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: |
          xcodebuild -version
          cmake -S . -B build/ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DSEGASONIC_REFERENCE_TOOLS=OFF -DSONIC_BIN_DIR="$PWD/build/bin-ios"

      - name: Build
        run: cmake --build build/ios --config Release --target segasonic_ios_games -- CODE_SIGNING_ALLOWED=NO

      - name: Check
        run: |
          app="build/bin-ios/ios/SegaSonic.app"
          plist="$app/Info.plist"
          plutil -lint "$plist"
          plutil -p "$plist"
          for key in CFBundleIdentifier CFBundleExecutable MinimumOSVersion UIDeviceFamily UIFileSharingEnabled \
            LSSupportsOpeningDocumentsInPlace UISupportedInterfaceOrientations UILaunchStoryboardName \
            UIRequiresFullScreen GCSupportedGameControllers CFBundleIcons; do
            plutil -extract "$key" xml1 -o - "$plist" > /dev/null || { echo "no $key in Info.plist"; exit 1; }
          done
          lipo -info "$app/SegaSonic"
          otool -l "$app/SegaSonic" | grep -A4 LC_BUILD_VERSION
          otool -l "$app/SegaSonic" | grep -A2 LC_BUILD_VERSION | grep -Eq "platform (2|IOS)$" || { echo "not iOS's"; exit 1; }
          for resource in font.bmp input_prompts.bmp; do
            [ -e "$app/$resource" ] || { echo "no $resource in the app"; exit 1; }
          done
          ls -la "$app"
          unzip -l "build/bin-ios/ios/SegaSonic.ipa"
          unzip -l "build/bin-ios/ios/SegaSonic.ipa" | grep -q "Payload/SegaSonic.app/SegaSonic\$" || { echo "SegaSonic.ipa: no app"; exit 1; }
          if unzip -l "build/bin-ios/ios/SegaSonic.ipa" | grep -E '\.assets$|\.zip$'; then echo "SegaSonic.ipa: assets in it"; exit 1; fi
          plutil -extract CFBundleIdentifier raw -o - "$plist" | grep -qx io.github.cheviman.segasonic-port

      - name: Pack
        run: |
          mkdir -p dist/segasonic-ios/ios
          cp build/bin-ios/ios/SegaSonic.ipa dist/segasonic-ios/ios/
          cp docs/package/README-ios.txt dist/segasonic-ios/README.txt
          cp LICENSE dist/segasonic-ios/LICENSE.txt
          mkdir -p dist/segasonic-ios/licenses
          cp tools/reference/mame/LICENSE dist/segasonic-ios/licenses/MAME.txt
          cp tools/reference/ymfm/LICENSE dist/segasonic-ios/licenses/ymfm.txt
          cp build/ios/_deps/sdl3-src/LICENSE.txt dist/segasonic-ios/licenses/SDL3.txt
          cp ports/sdl/font/License.txt dist/segasonic-ios/licenses/Kenney-Fonts.txt
          cp lan/LICENSE dist/segasonic-ios/licenses/arcade-lan.txt
          cp ports/sdl/controllerdb/LICENSE dist/segasonic-ios/licenses/SDL_GameControllerDB.txt
          if [ -f ports/sdl/prompts/License.txt ]; then
            cp ports/sdl/prompts/License.txt dist/segasonic-ios/licenses/Kenney-Input-Prompts.txt
          fi
          ls -laR dist/segasonic-ios
          cd dist && zip -r -X segasonic-ios.zip segasonic-ios

      - uses: actions/upload-artifact@v7
        with:
          name: segasonic-ios
          path: dist/segasonic-ios.zip

  # The iOS app built for the Simulator (arm64, its own build folder) and started there, with no ROM set:
  # it must start, write its log in its Documents folder and say there where to put sonic.zip. A screenshot
  # of it (its message) in the artifact ios-simulator-screens. A check: the release does not wait for it
  ios-simulator:
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Configure
        run: |
          cmake -S . -B build/ios-simulator -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DSEGASONIC_REFERENCE_TOOLS=OFF \
            -DSONIC_BIN_DIR="$PWD/build/bin-ios-simulator"

      - name: Build
        run: cmake --build build/ios-simulator --config Release --target segasonic_ios_games -- CODE_SIGNING_ALLOWED=NO

      - name: Start in the Simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device["udid"] for runtime in sorted(runtimes, reverse=True) if ".iOS-" in runtime
                    for device in runtimes[runtime] if device["name"].startswith("iPhone")]
          print(phones[0])')
          echo "Simulator: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          mkdir -p screens
          xcrun simctl install "$device" "build/bin-ios-simulator/ios/SegaSonic.app"
          xcrun simctl launch "$device" "io.github.cheviman.segasonic-port"
          data=$(xcrun simctl get_app_container "$device" "io.github.cheviman.segasonic-port" data)
          for second in $(seq 90); do
            grep -q "No ROM set" "$data/Documents/segasonic.log" 2>/dev/null && break
            sleep 1
          done
          sleep 3
          xcrun simctl io "$device" screenshot "screens/segasonic.png"
          cat "$data/Documents/segasonic.log"
          grep -q "No ROM set" "$data/Documents/segasonic.log" || { echo "no message in its log"; exit 1; }
          xcrun simctl terminate "$device" "io.github.cheviman.segasonic-port" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-screens
          path: screens/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, anbernic, raspberrypi, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # (lan/: arcade-lan, MULTIPLAYER's)

      - uses: actions/download-artifact@v8
        with:
          pattern: segasonic-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SegaSonic $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/segasonic-windows-x64.zip dist/segasonic-linux-x64.tar.gz dist/segasonic-macos-universal.zip \
            dist/segasonic-anbernic.zip dist/segasonic-raspberrypi-arm64.tar.gz dist/segasonic-ios.zip
